<!DOCTYPE html>
<html>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="c180" width="180" height="180"></canvas>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext('2d');
  // Background
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, s * 0.2);
  ctx.fill();
  // Golf ball circle
  ctx.fillStyle = '#6366f1';
  ctx.beginPath();
  ctx.arc(s/2, s * 0.42, s * 0.22, 0, Math.PI * 2);
  ctx.fill();
  // Flag
  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = s * 0.02;
  ctx.beginPath();
  ctx.moveTo(s * 0.5, s * 0.2);
  ctx.lineTo(s * 0.5, s * 0.65);
  ctx.stroke();
  // Flag triangle
  ctx.fillStyle = '#22c55e';
  ctx.beginPath();
  ctx.moveTo(s * 0.5, s * 0.2);
  ctx.lineTo(s * 0.68, s * 0.28);
  ctx.lineTo(s * 0.5, s * 0.36);
  ctx.fill();
  // Text
  ctx.fillStyle = '#f1f5f9';
  ctx.font = `bold ${s * 0.11}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText('MATCH', s/2, s * 0.78);
  ctx.fillText('PLAY', s/2, s * 0.9);
}
drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
drawIcon(document.getElementById('c180'));
</script>
</body>
</html>
